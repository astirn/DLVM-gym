version: v2
description: Experiment pipeline
budget: ai1/octo.ai
tasks:
  - name: vampprior_unleashed
    image:
      beaker: astirn/base-dev
    command: [bash, -c]
    arguments:
      - |
        echo -e "\n=== Project Directory ==="
        cd /home/andrew.stirn/projects/VampPrior-Paradox
        ls -la

        # Basic system info
        echo -e "\n=== System Info ==="
        echo "Host: $(hostname) | $(uname -sr)"
        echo "GPUs: $(nvidia-smi --query-gpu=name --format=csv,noheader | wc -l) | Memory: $(free -h | grep Mem | awk '{print $2}')"

        # Run script
        # bash scripts/clustering/baselines.sh mnist -n 5
        # bash scripts/clustering/baselines.sh fashion_mnist -n 5
        # bash scripts/clustering/sweep_k.sh mnist -n 5
        # bash scripts/clustering/sweep_k.sh fashion_mnist -n 5
        # bash scripts/clustering/sweep_dp_conc.sh mnist -n 5
        # bash scripts/clustering/sweep_dp_conc.sh fashion_mnist -n 5

        # bash scripts/scRNA/sweep_dp_conc.sh op_dkd -n 3
        # bash scripts/scRNA/sweep_dp_conc.sh op_immune_cell_atlas -n 3
        # bash scripts/scRNA/sweep_dp_conc.sh op_gtex_v9 -n 3
        # bash scripts/scRNA/sweep_dp_conc.sh op_mouse_pancreas_atlas -n 3
        # bash scripts/scRNA/sweep_dp_conc.sh op_hypomap -n 3
        # bash scripts/scRNA/sweep_dp_conc.sh op_tabula_sapiens -n 3

    datasets:
      - mountPath: /home/andrew.stirn/projects/VampPrior-Paradox
        source:
          hostPath: /home/andrew.stirn/projects/VampPrior-Paradox

    envVars:
      - name: WANDB_API_KEY
        secret: WANDB_API_KEY

    result:
      path: /output

    resources:
      gpuCount: 1
      sharedMemory: 40 GiB

    context:
      priority: normal
      preemptible: false

    constraints:
      cluster: [ai1/octo.ai-aws-g6e]

    timeout: 720h
