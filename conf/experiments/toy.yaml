# @package _global_

defaults:
  - /callbacks@callbacks: default
  - /priors@model.prior_params: crypt/dp_vampprior_unchained
  - /metrics@metrics: default
  - /hydra
  - /paths
  - /trainer@trainer: step_based
  - _self_

experiment_name: Toy
seed: 123

data:
  _target_: src.data.GaussianMixtureDataModule
  batch_size: 256
  num_clusters: 3
  num_data: 1000
  seed: ${seed}

model:
  _target_: src.models.VariationalAutoencoder
  _recursive_: false

  dim_z: 1

  encoder_params:
    _target_: src.experiments.toy.Encoder
    hidden_dim: 100

  decoder_params:
    _target_: src.experiments.toy.Decoder
    hidden_dim: 100

  prior_params:
    dim_z: ${model.dim_z}
    concentration: 5.0

  stratified_u_initial: false

metrics:
  validation_metrics:
    - _target_: src.metrics.ClusteringMetrics
      label_key: c

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-3
  weight_decay: 0.0

trainer:
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm
  max_steps: 5000
  val_check_interval: 500
