# @package _global_

defaults:
  - /callbacks@callbacks: default
  - /priors/crypt@model: dp_vampprior_unchained
  - /hydra@hydra: default
  - /trainer@trainer: step_based
  - _self_

seed: 0

data:
  _target_: src.data.GaussianMixtureDataModule
  batch_size: 256
  num_clusters: 3
  num_samples:
    train: 1000
    val: 1000
    test: 1000
  seed: ${seed}

model:
  _recursive_: false

  dim_z: 1
  k: 40
  
  decoder_params:
    _target_: src.experiments.toy.Decoder
    hidden_dim: 100

  encoder_params:
    _target_: src.experiments.toy.Encoder
    hidden_dim: 100

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-3
  weight_decay: 0.0

trainer:
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  max_steps: 5000
  val_check_interval: 500
