# @package _global_

defaults:
  - /callbacks@callbacks: default
  - /crypt@model: dp_vamp_prior_unchained
  - /hydra@hydra: default
  - /trainer@trainer: step_based
  - _self_

seed: null

data:
  _target_: src.data.ClusteringDataModule
  dataset: ???
  batch_size: 512
  num_workers: 8
  pin_memory: true
  root: datasets/clustering

model:
  _recursive_: false

  dim_z: ???
  k: 100

  decoder_params:
    _target_: src.experiments.clustering.Decoder

  encoder_params:
    _target_: src.experiments.clustering.Encoder

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-3
  weight_decay: 0.0

trainer:
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  max_steps: 20000
  val_check_interval: 1000
