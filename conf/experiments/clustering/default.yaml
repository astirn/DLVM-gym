# @package _global_

defaults:
  - /callbacks@callbacks: default
  - /priors@model.prior_params: crypt/dp_vampprior_unchained
  - /metrics@metrics: default
  - /hydra@hydra: default
  - /trainer@trainer: step_based
  - _self_

seed: 123

data:
  _target_: src.data.ClusteringDataModule
  dataset: ???
  batch_size: 512
  num_workers: 8
  pin_memory: true
  root: datasets/clustering

model:
  _target_: src.models.VariationalAutoencoder
  _recursive_: false

  dim_z: ???

  decoder_params:
    _target_: src.experiments.clustering.Decoder

  encoder_params:
    _target_: src.experiments.clustering.Encoder

  prior_params:
    dim_z: ${model.dim_z}

metrics:
  validation_metrics:
    - _target_: src.metrics.ClusteringMetrics
      label_key: c

  test_metrics:
    - _target_: src.metrics.ModelMetrics

optimizer:
  _target_: torch.optim.AdamW
  lr: 1e-3
  weight_decay: 0.0

trainer:
  gradient_clip_val: 1.0
  gradient_clip_algorithm: "norm"
  max_steps: 20000
  val_check_interval: 100
