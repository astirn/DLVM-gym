# @package _global_

defaults:
  - default
  - _self_

data:
  dataset: cortex
  prepare_data_fn:
    _target_: toolz.compose_left
    _args_:
      - _target_: scvi.data.cortex
        _partial_: true
      - _target_: toolz.do
        _partial_: true
        _args_:
          - _target_: scanpy.pp.highly_variable_genes
            _partial_: true
            n_top_genes: 558
            flavor: seurat_v3
            subset: true
      - _target_: src.data.utils.constant_batch
        _partial_: true

model:
  dim_z: 10

  encoder_params:
    _target_: src.experiments.scRNA.Encoder
    dim_hidden: 128
    num_layers: 1

  decoder_params:
    _target_: src.experiments.scRNA.Decoder
    dim_hidden: 128
    num_layers: 1
    gene_likelihood: zinb
