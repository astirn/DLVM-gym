# @package _global_

defaults:
  - /callbacks@callbacks: default
  - /loggers@loggers: default
  - /priors@model.prior_params: crypt/dp_vampprior_unchained
  - /hydra
  - /paths
  - /trainer@trainer: step_based
  - _self_

experiment_name: scRNA/${data.dataset}
seed: 1

data:
  _target_: src.data.scRNA.scRNADataModule
  dataset: ???
  prepare_data_fn: ???
  val_ratio: 0.1
  test_ratio: 0.1
  batch_size:
    train: 128
    val: 128
    test: 8
    predict: 128
  num_workers: 8
  pin_memory: true
  root: datasets/scRNA-seq
  seed: ${seed}

model:
  _target_: src.models.scVI
  _recursive_: false

  dim_z: ???
  encode_covariates: true
  deeply_inject_covariates: false

  decoder_params:
    _target_: src.experiments.scRNA.Decoder

  encoder_params:
    _target_: src.experiments.scRNA.Encoder

  prior_params:
    dim_z: ${model.dim_z}
    concentration: 5.0

  u_initial_strategy: random
  kl_warmup_steps: 0

metrics:
  validation_metrics:
    - _target_: src.metrics.ClusteringMetrics
      label_key: c

  test_metrics:
    - _target_: src.metrics.ModelMetrics
      k: 5000

  full_metrics:
    - _target_: src.metrics.ClusteringMetrics
      label_key: c
    - _target_: src.metrics.scIBMetrics

optimizer:
  _target_: torch.optim.AdamW
  lr: ???
  weight_decay: 0.0

model_wrapper:
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

trainer:
  max_steps: 20000
  val_check_interval: 50
