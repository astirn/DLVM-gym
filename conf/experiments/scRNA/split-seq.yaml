# @package _global_

defaults:
  - op_default
  - override /priors@model.prior_params: crypt/dp_vampprior_unleashed
  - _self_

data:
  dataset: split-seq
  prepare_data_fn:
    _target_: toolz.compose_left
    _args_:
      - _target_: src.data.utils.load_split_seq
        _partial_: true
      - _target_: src.data.utils.rename_adata_obs
        _partial_: true
        columns:
          polydT: batch
          cellchat_clusters: cell_type

model:
  encode_covariates: true
  deeply_inject_covariates: true

  prior_params:
    dim_z: ${model.dim_z}
    concentration: 5.0
    concentration_prior: null

  u_initial_strategy: stratified_data
  kl_warmup_epochs: 0 # openproblems uses full 400-epoch KL warmup

analyses:
  - _target_: src.analysis.differential_expression.differential_expression
    _partial_: true
